services:
  mysql:
    image: mysql:8.0
    container_name: repairshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: repair_shop_management
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: repairshop-backend:1.0.0
    build:
      context: ./repair-shop-backend
    container_name: repairshop-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://192.168.190.1:3310/repair_shop_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      SERVER_PORT: 8080
    ports:
      - "8070:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: repairshop-frontend:1.0.0
    build:
      context: ./repair-shop-frontend
      args:
        VITE_API_URL: http://192.168.190.133:8070/api
        VITE_WS_URL: http://192.168.190.133:8070/ws
    container_name: repairshop-frontend
    restart: unless-stopped
    ports:
      - "5173:3000"
    depends_on:
      - backend

volumes:
  mysql_data: